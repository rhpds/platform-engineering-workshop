---
apiVersion: batch/v1
kind: Job
metadata:
  name: quay-integration
  namespace: stackrox
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      serviceAccountName: quay-integration
      restartPolicy: OnFailure
      containers:
        - name: quay-integration
          image: registry.redhat.io/openshift4/ose-cli-rhel9:latest
          env:
            - name: QUAY_NAMESPACE
              value: {{ .Values.quay.namespace | quote }}
            - name: VAULT_NAMESPACE
              value: {{ .Values.vault.namespace | quote }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              SECRET_NAME="quay-registry-pull-secret"

              # Wait for Central to be ready
              echo "Waiting for Central..."
              until curl -sk https://central.stackrox.svc:443/v1/ping; do
                echo "Central not ready, retrying in 10s..."
                sleep 10
              done
              echo "Central is ready"

              # Get admin password
{{- if .Values.adminPassword }}
              PASSWORD=$(oc get secret central-admin-password -n stackrox -o jsonpath='{.data.password}' | base64 -d)
{{- else }}
              PASSWORD=$(oc get secret central-htpasswd -n stackrox -o jsonpath='{.data.password}' | base64 -d)
{{- end }}

              # Wait for QuayRegistry CR to have a registryEndpoint in status
              echo "Waiting for QuayRegistry to be ready..."
              until QUAY_ENDPOINT=$(oc get quayregistry -n "$QUAY_NAMESPACE" -o jsonpath='{.items[0].status.registryEndpoint}' 2>/dev/null) && [ -n "$QUAY_ENDPOINT" ]; do
                echo "QuayRegistry not ready, retrying in 10s..."
                sleep 10
              done
              echo "QuayRegistry endpoint: $QUAY_ENDPOINT"

              # Strip protocol prefix for Docker config
              QUAY_HOST="${QUAY_ENDPOINT#https://}"
              QUAY_HOST="${QUAY_HOST#http://}"

              # Read Quay admin password from Vault
              echo "Reading Quay admin password from Vault..."
              QUAY_PASSWORD=$(oc exec vault-0 -n "$VAULT_NAMESPACE" -- vault kv get -field=value kv/secrets/quay/password)
              if [ -z "$QUAY_PASSWORD" ]; then
                echo "ERROR: Failed to read Quay password from Vault"
                exit 1
              fi

              QUAY_USER="quayadmin"

              # Create the pull secret if it doesn't exist
              if ! oc get secret "$SECRET_NAME" -n stackrox &>/dev/null; then
                oc create secret docker-registry "$SECRET_NAME" \
                  -n stackrox \
                  --docker-server="$QUAY_HOST" \
                  --docker-username="$QUAY_USER" \
                  --docker-password="$QUAY_PASSWORD"
                echo "Pull secret '$SECRET_NAME' created successfully in stackrox"
              else
                echo "Pull secret '$SECRET_NAME' already exists in stackrox, skipping"
              fi

              # Register Quay as an image integration in ACS Central
              echo "Checking for existing Quay image integration..."
              EXISTING=$(curl -sk -u "admin:${PASSWORD}" \
                https://central.stackrox.svc:443/v1/imageintegrations \
                | python3 -c "
import sys, json
data = json.load(sys.stdin)
for i in data.get('integrations', []):
    d = i.get('docker', {})
    ep = d.get('endpoint', '')
    if '${QUAY_HOST}' in ep and not i.get('autogenerated', False):
        print(i['id'])
        break
" 2>/dev/null)

              if [ -n "$EXISTING" ]; then
                echo "Quay image integration already exists (id: $EXISTING), skipping"
                exit 0
              fi

              echo "Creating Quay image integration in ACS..."
              RESPONSE=$(curl -sk -u "admin:${PASSWORD}" \
                -X POST https://central.stackrox.svc:443/v1/imageintegrations \
                -H "Content-Type: application/json" \
                -d "{
                  \"name\": \"Quay (workshop)\",
                  \"type\": \"docker\",
                  \"categories\": [\"REGISTRY\"],
                  \"docker\": {
                    \"endpoint\": \"${QUAY_HOST}\",
                    \"username\": \"${QUAY_USER}\",
                    \"password\": \"${QUAY_PASSWORD}\",
                    \"insecure\": false
                  },
                  \"skipTestIntegration\": true
                }")

              INTEGRATION_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null)
              if [ -z "$INTEGRATION_ID" ]; then
                echo "ERROR: Failed to create Quay image integration"
                echo "Response: $RESPONSE"
                exit 1
              fi

              echo "Quay image integration created successfully (id: $INTEGRATION_ID)"
